name: pace
services:
  core-service:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/pace.db
    volumes:
      - pace-data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    depends_on:
      core-service:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging: *logging
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on: [gateway]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *logging
volumes:
  pace-data:
