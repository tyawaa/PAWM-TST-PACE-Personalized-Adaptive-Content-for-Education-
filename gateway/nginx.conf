events { worker_connections 256; }
http {
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_status 429;
    client_max_body_size 64k;
    server_tokens off;
    server {
        listen 80;
        add_header X-Content-Type-Options nosniff always;
        # Cloudflare diperlakukan sebagai satu upstream; limit ini sengaja global.
        # Jangan percaya X-Forwarded-For tanpa konfigurasi trusted proxy.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://core-service:8000;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://core-service:8000;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
